---
daemon:
  # Inside Docker, keep 0.0.0.0 and choose the host address/port in the port mapping
  listen: 0.0.0.0
  port: 9876
  base_url: "/api/v0"
  # Number of threads handling requests concurrently
  threads: 4
  # Worker timeout in seconds; must also allow enough time to load the model at startup
  timeout: 120

faster_whisper:
  debug:
    save_audio: no
    save_path: /tmp/rfw
  # The /models volume in Docker
  model_cache_dir: /models
  model: small
  device: auto
  device_index: 0
  compute_type: int8
  beam_size: 5
  translate: yes
  language:
  # Words and phrases to listen for, e.g. the names of your devices
  hotwords:
  # Skip audio without speech; recommended with hotwords
  vad_filter: no

transformations:
# Examples:
# lowercase the string
# - lower
# replace punctuation; note the double-bashslash for a literal '.'
# - ["[\\.,!?]", ""]
# substitute "trash was/with" with "joshua's"
# - ["trash (was|with)", "joshua's"]
